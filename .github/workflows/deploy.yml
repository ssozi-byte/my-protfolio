# .github/workflows/deploy.yml
#
# Builds the fully static site and deploys it to Cloudflare Pages.
# The deploy step only UPLOADS FILES — no Cloudflare Workers/Functions are
# created or run, so the free-tier request/CPU limits never apply.
#
# One-time setup (Dashboard → GitHub App method is simpler and skips secrets):
#   Cloudflare Dashboard → Workers & Pages → Create → Pages → Connect to Git.
# If you use THIS workflow instead, add these repo secrets:
#   CLOUDFLARE_API_TOKEN  (Permissions: Account → Cloudflare Pages → Edit)
#   CLOUDFLARE_ACCOUNT_ID
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent overlapping deploys.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build (static)
        run: npm run build

      - name: Guard — fail if build is not pure static
        run: |
          if [ -e dist/_worker.js ] || [ -d dist/_worker.js ]; then
            echo "::error::_worker.js found — server-side output leaked in!"; exit 1
          fi
          if grep -Rl "import.meta.env.ACTIVE" dist --include='*.js' >/dev/null 2>&1; then
            echo "::warning::server-only imports referenced in bundle"; fi
          echo "dist is pure static ✓ ($(find dist -type f | wc -l) files)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=my-portfolio
